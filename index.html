<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>What's For Dinner</title>

  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>


<body>

 <!-- Navbar -->
    <header>
        <nav class="site-navbar">

            <div class="brand-wrap">

                <div class="brand-mark">
                    <i class="fa-solid fa-utensils"></i>
                </div>

                <div class="brand-info">
                    <h1 class="brand-title">What's For Dinner</h1>
                    <p class="brand-subtitle">Your daily meal inspiration</p>
                </div>

            </div>

            <div class="nav-actions">

                <button class="nav-action" id="savedNav" title="Saved Recipes">
                    <i class="fa-regular fa-bookmark"></i>
                </button>

                <button class="nav-action" id="historyNav" title="History">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>

                <button class="nav-action" id="settingsNav" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>

                <img
                    class="profile-avatar"
                    src="./image/logo-profile.jpg"
                    alt="Profile">

            </div>

        </nav>
    </header>


    <!-- Main Content -->
    <main id="app" class="container"></main>


    

<script src="./js/main.js"></script>
  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
